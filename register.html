<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | CampusEvents</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <nav class="navbar">

            <div class="logo">CampusEvents</div>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="events.html">Events</a></li>
                <li><a href="about.html">About</a></li>
            </ul>

            <a href="register.html" class="register-btn">Register</a>

        </nav>
    </header>


    <main>

        <section class="events-section">

            <p class="small-title">JOIN AN EVENT</p>

            <h1>Event Registration</h1>

            <p class="hero-text">
                Fill in your details to register for a college event.
            </p>


            <form id="registrationForm">

                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your name" required>


                <label for="studentId">Student ID</label>
                <input type="text" id="studentId" placeholder="Enter your student ID" required>


                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>


                <label for="event">Select Event</label>

                <select id="event" required>
                    <option value="">Choose an event</option>
                    <option value="Tech Fest 2026">Tech Fest 2026</option>
                    <option value="Cultural Fest">Cultural Fest</option>
                    <option value="Sports Meet">Sports Meet</option>
                </select>


                <button type="submit" class="primary-btn">
                    Submit Registration
                </button>

            </form>


            <div id="successMessage"></div>

        </section>

    </main>


    <footer>
        <p>© 2026 CampusEvents. College Event Management System.</p>
        <p>Developed by Prachi Sharma • Dhatri Pandya • Lucky Patel</p>
    </footer>


    <script src="js/script.js"></script>

</body>

</html>
